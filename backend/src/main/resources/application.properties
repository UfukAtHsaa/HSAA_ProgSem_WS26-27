spring.application.name=hello

# Postgres aus docker-compose.yml. Das Passwort kommt aus der .env, nicht aus dem Repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/broker}
spring.datasource.username=${DB_USER:broker}
spring.datasource.password=${DB_PASSWORD}

# Tabellen aus den Entities anlegen und beim Neustart behalten.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Höchstens 100 Einträge pro Seite, egal was der Client als size schickt.
spring.data.web.pageable.max-page-size=100

# Passwörter der Beispielbenutzer, siehe .env.example
broker.admin-password=${ADMIN_PASSWORD}
broker.kunde-password=${KUNDE_PASSWORD}

# Externe API für Wechselkurse (Vorlesung 5). Kostenlos, ohne Key.
# Die Adresse lässt sich über FX_API_URL ändern, z. B. um "API ist weg" vorzuführen.
spring.http.serviceclient.frankfurter.base-url=${FX_API_URL:https://api.frankfurter.dev}
# Ohne Timeout wartet der Shop ewig, wenn die API hängt. Lieber schnell aufgeben und Fallback zeigen.
spring.http.serviceclient.frankfurter.connect-timeout=2s
spring.http.serviceclient.frankfurter.read-timeout=2s
# Bräuchte die API einen Key, käme er so aus der .env, nie ins Repo:
# spring.http.serviceclient.frankfurter.default-header.X-Api-Key=${FX_API_KEY}
