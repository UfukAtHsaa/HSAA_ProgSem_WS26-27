<main class="page">
  <h1>Angular &amp; Spring Boot</h1>

  @if (loading()) {
    <p class="status">Loading greeting&hellip;</p>
  } @else if (errorMessage(); as message) {
    <p class="status error">{{ message }}</p>
    <button type="button" (click)="load()">Try again</button>
  } @else if (greeting(); as greeting) {
    <p class="greeting">{{ greeting.message }}</p>
    <p class="meta">Served by the backend at {{ greeting.servedAt | date: 'medium' }}</p>
  }
</main>
