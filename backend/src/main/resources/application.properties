spring.application.name=hello

# Postgres aus docker-compose.yml. Das Passwort kommt aus der .env, nicht aus dem Repo.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/broker}
spring.datasource.username=${DB_USER:broker}
spring.datasource.password=${DB_PASSWORD}

# Tabellen aus den Entities anlegen und beim Neustart behalten.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Höchstens 100 Einträge pro Seite, egal was der Client als size schickt.
spring.data.web.pageable.max-page-size=100

# Passwörter der Beispielbenutzer, siehe .env.example
broker.admin-password=${ADMIN_PASSWORD}
broker.kunde-password=${KUNDE_PASSWORD}
