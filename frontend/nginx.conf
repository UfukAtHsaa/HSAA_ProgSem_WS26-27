server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Build assets are content-hashed, so they can be cached forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # The app calls a relative /api/hello, which lands here and is forwarded to
    # the backend container on the compose network. Because the browser only ever
    # talks to nginx, no CORS configuration is needed anywhere.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # index.html itself must not be cached, or clients keep loading stale bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths fall back to the router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}